name: keep-alive

# Streamlit Community Cloud apps sleep without viewer traffic, and anonymous
# curl requests are intercepted by the edge (303 to sign-in) without ever
# reaching the app backend. This workflow therefore pings the deployed app
# with a headless browser every 10 minutes: it completes a full session
# (HTTP 200 + app render), keeping the instance warm for live evaluation
# probes, and logs the observed TTFB on every run.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Warm app and measure TTFB
        env:
          APP_URL: ${{ vars.MEDQC_APP_URL || 'https://kclyvpmwxya9ebazedsvc9.streamlit.app' }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              t0 = time.time()
              resp = page.goto(url, wait_until="commit", timeout=90000)
              ttfb_ms = int((time.time() - t0) * 1000)
              status = resp.status if resp else 0
              print(f"HTTP {status} - TTFB {ttfb_ms} ms")
              ok = status == 200
              if ok:
                  try:
                      page.wait_for_selector("text=Clinical Dashboard", timeout=60000)
                      print("app fully rendered")
                  except Exception as exc:  # noqa: BLE001
                      print("render timeout:", exc)
                      ok = False
              browser.close()
          sys.exit(0 if ok else 1)
          PY
